# Development: docker compose up --build
# Every port is published on 127.0.0.1: reachable from your computer only, not from the rest of your network
services:
  db:
    image: postgres:17
    # Creates the user and the database the first time, with the credentials of .env.db
    env_file: ./backend/.env.db
    # Open on your computer too, to connect with a database client
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    # Ready means accepting TCP connections like the backend's: on the first start the image runs a temporary
    # server reachable only through its local socket while it creates the user and the database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # The first start creates the database: failed checks during this time don't count
      start_period: 10s

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.api
      - ./backend/.env.db
    ports:
      - "127.0.0.1:8000:8000"
    # Your code inside the container: a saved change reloads the API
    volumes:
      - ./backend:/app
    # Logs with colors in docker compose logs
    tty: true
    # The migrations need the database ready
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      # Your code inside the container: a saved change reloads the page
      - ./frontend:/app
      # The container keeps its own node_modules: the one of your computer may have binaries for another system
      - /app/node_modules
    tty: true

  # Counters of the rate limiter, shared by every worker
  redis:
    image: redis:8

  # Catches every email the API sends, see them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      # Accepts the MAIL_USERNAME and MAIL_PASSWORD of .env.api without TLS, it's only for development
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
