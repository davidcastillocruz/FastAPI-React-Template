# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to %(here)s (folder of this .ini).
script_location = %(here)s/src/database/migrations

# Where the version files live.
version_locations = %(here)s/src/database/migrations/versions

# Prepend the project root (backend/) so `src.*` is importable from env.py.
prepend_sys_path = %(here)s

# Path separator for lists in this file.
path_separator = os

# Optional: prepend date+time to migration filenames.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# URL is injected by env.py from src.core.config.DATABASE_URL_ASYNC.
sqlalchemy.url =


[post_write_hooks]
# Format and lint each newly generated migration with Ruff.
hooks = ruff_check ruff_format

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME


# Logging configuration (consumed by env.py via fileConfig).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S