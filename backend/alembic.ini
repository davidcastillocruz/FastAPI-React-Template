# Alembic config. Commands, from the backend folder:
#   alembic revision --autogenerate -m "what changed"   new migration from the models
#   alembic upgrade head                                 apply the pending migrations
#   alembic downgrade -1                                 undo the last migration
# The database URL is not here: alembic/env.py takes it from src/core/settings.py

[alembic]
# Folder of the migration scripts
script_location = %(here)s/alembic

# Migration files sorted by date: 2026_10_13_0930-<rev>_<message>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# The backend folder goes in sys.path, so env.py can import src
prepend_sys_path = .
path_separator = os

# Logging of the alembic commands
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
