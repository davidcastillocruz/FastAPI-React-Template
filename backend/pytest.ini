[pytest]
testpaths = tests
pythonpath = .
# Outside the code folder: in Docker the folder is your computer's and the cache would belong to root
cache_dir = /tmp/.pytest_cache
asyncio_mode = auto
# One event loop for the whole run: the database connections are reused between tests
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
