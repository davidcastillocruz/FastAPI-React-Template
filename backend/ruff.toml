# Linter of the backend: docker compose exec backend ruff check (CI runs it on every push)
# ruff check --fix fixes most of what it finds (unused imports, import order, old syntax...)
target-version = "py314"
line-length = 120
# Migrations are generated by Alembic: their style comes from its template, not from these rules
extend-exclude = ["alembic/versions"]

[lint]
# E4/E7/E9/F: real errors (unused imports, undefined names...), W: stray whitespace,
# I: sorted imports, UP: modern syntax (X | None, list[str]...), B: common bugs,
# SIM: simpler code, C4: cleaner comprehensions, PERF: slow patterns, RUF: ruff's own checks,
# E501: lines up to line-length, COM812: trailing comma in every call or literal split over several lines
select = ["E4", "E501", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "C4", "PERF", "RUF", "COM812"]

[lint.isort]
# The code of src goes after the libraries, in its own group
known-first-party = ["src"]
# The alembic/ folder of migrations would make ruff take the alembic library as code of the project
known-third-party = ["alembic"]

[lint.per-file-ignores]
# Imported only so SQLAlchemy and Alembic register every model, never used by name
"src/database/models.py" = ["F401"]
