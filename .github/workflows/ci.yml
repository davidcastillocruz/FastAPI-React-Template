# Checks the backend and the frontend on every push and pull request, on a clean GitHub machine
name: CI

on:
  push:
  pull_request:

# The jobs only read the code: their token can't change the repository
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    # A hung test stops here instead of running for hours
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # Same database as docker-compose.yml, with the credentials of .env.db.example
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Same version as the Dockerfile
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Every setting is required: the examples give them a value, the database is on this machine
      - name: Create the env files
        run: |
          cp .env.api.example .env.api
          cp .env.db.example .env.db

      # The tests build the tables from the models: a model changed without its migration fails here
      - name: Check the migrations
        env:
          DATABASE_HOST: localhost
        run: alembic upgrade head && alembic check

      - name: Run the tests
        env:
          DATABASE_HOST: localhost
        run: pytest

  backend-checks:
    name: Backend lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ruff and pyright are pinned in requirements.txt, the same versions as in the container
      - run: pip install -r requirements.txt

      # Rules in ruff.toml: real errors, modern syntax, sorted imports, common bugs
      - name: Lint
        run: ruff check --output-format=github .

      # Settings in pyrightconfig.json: a wrong type fails here before it reaches a test
      - name: Type check
        run: pyright

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same version as frontend/Dockerfile
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx oxlint src

      - name: Run the tests
        run: npm test

      # The build fails on a broken import or a syntax error that the dev server would only show when opening the page
      - name: Build
        run: npm run build
